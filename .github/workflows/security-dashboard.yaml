name: Security Dashboard

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print intended writes instead of performing them"
        type: boolean
        default: false
      debug:
        description: "Open an interactive tmate session before running the pipeline"
        type: boolean
        default: false
      seed:
        description: "Remediation test: inject a synthetic finding (owner/repo=package@version). Combine with dry_run to preview the PR."
        type: string
        default: ""
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: security-dashboard
  cancel-in-progress: false

permissions:
  contents: write        # push the artifact branch
  pull-requests: write   # hold the one PR that lands it on main
  pages: write           # publish the HTML dashboard to GitHub Pages
  id-token: write        # OIDC token required by deploy-pages

jobs:
  dashboard:
    runs-on: oracle-vm-16cpu-64gb-x86-64
    outputs:
      # Set by the Pages upload, so `deploy` can run off the artifact rather
      # than off the whole job. A git problem in the publish step below must
      # not be able to freeze the published dashboard again.
      published: ${{ steps.pages_artifact.outputs.published }}
    env:
      # The org ruleset on ~DEFAULT_BRANCH requires a pull request, so the
      # generated artifacts cannot be pushed to main. They live on this branch
      # and reach main through the one PR the publish step keeps open.
      ARTIFACT_BRANCH: ksec/dashboard-artifacts
      # A local ref, so the two steps below do not depend on FETCH_HEAD
      # surviving every step in between.
      ARTIFACT_REF: refs/ksec/artifact-branch
      # Scheduled runs are LIVE by default; dispatch can request dry-run; forks force it.
      DRYRUN: ${{ (github.event.inputs.dry_run == 'true' || github.event.pull_request.head.repo.fork) && '--dry-run' || '' }}
      KSEC_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Remediation is LIVE by default (same dry-run rule as the rest of the
      # pipeline: dry-run only on a dispatch dry_run request or a fork PR).
      # NOTE: live remediation needs KSEC_BOT_TOKEN to have contents:write +
      # pull_requests:write on the target repos.
      REMEDIATE_DRYRUN: ${{ (github.event.inputs.dry_run == 'true' || github.event.pull_request.head.repo.fork) && '--dry-run' || '' }}
      # AI-drafted PR descriptions (set to "false" to use deterministic text).
      AI_PR_PROSE: "true"
      # Cross-repo reads + the kairos tracking-issue write use the scoped bot token.
      GH_TOKEN: ${{ secrets.KSEC_BOT_TOKEN }}
      LOCALAI_URL: http://localhost:8080
      # NOTE: do NOT set MODEL/BASE_URL/API_KEY at the job level. LocalAI reads
      # API_KEY as its OWN server-side auth requirement, so a job-level API_KEY
      # makes the LocalAI server reject the unauthenticated triage/summary
      # clients with HTTP 401. nib's model env (MODEL/BASE_URL/API_KEY) is set
      # per-subprocess by NibAgent (internal/remediate/nib_agent.go) from
      # ai.yaml, so it never touches the LocalAI server or the other clients.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # While the artifact PR waits for a human, ARTIFACT_BRANCH holds newer
      # state than main does. Start from it, so the pipeline stays incremental
      # across runs the way the README describes, instead of replaying from
      # whatever main last merged. Once the PR is merged the branch is an
      # ancestor of main and main is authoritative again.
      - name: Restore state from the artifact branch
        run: |
          set -euo pipefail
          if ! git fetch origin "+refs/heads/$ARTIFACT_BRANCH:$ARTIFACT_REF"; then
            echo "no $ARTIFACT_BRANCH yet: starting from main's state"
            exit 0
          fi
          if git merge-base --is-ancestor "$ARTIFACT_REF" HEAD; then
            echo "$ARTIFACT_BRANCH is already merged: starting from main's state"
            exit 0
          fi
          git checkout "$ARTIFACT_REF" -- state/ dashboard.md dashboard.json
          echo "restored state/ + dashboards from $ARTIFACT_BRANCH ($(git rev-parse --short "$ARTIFACT_REF"))"

      - uses: actions/setup-go@v6
        with:
          go-version: "stable"

      # Install everything into a workspace-local bin/ on PATH, so we never
      # need root-owned dirs (ARC runners typically run as a non-root user).
      - name: Set up local tools dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$GITHUB_WORKSPACE/bin"

      # ARC runners are ephemeral, so cache the downloaded model weights between
      # runs (keyed on ai.yaml, so a model change invalidates the cache).
      - name: Cache LocalAI models
        uses: actions/cache@v6
        with:
          path: models
          key: localai-models-${{ hashFiles('ai.yaml') }}

      # LocalAI runs as a downloaded binary (no Docker — ARC runners have no
      # dind). Best-effort: if it can't start or load the model, triage uses
      # its deterministic fallback, so the pipeline must not fail here.
      - name: Start LocalAI (binary, best-effort)
        continue-on-error: true
        run: |
          set +e
          curl -sfL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o "$GITHUB_WORKSPACE/bin/yq" && chmod +x "$GITHUB_WORKSPACE/bin/yq"
          # LocalAI release assets embed the version: local-ai-<tag>-linux-amd64.
          ver="${LOCALAI_VERSION:-latest}"
          if [ "$ver" = "latest" ]; then
            ver="$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/mudler/LocalAI/releases/latest | yq -p=json '.tag_name')"
          fi
          echo "LocalAI version resolved to: '$ver'"
          url="https://github.com/mudler/LocalAI/releases/download/${ver}/local-ai-${ver}-linux-amd64"
          echo "Downloading $url"
          code=$(curl -sL -w '%{http_code}' "$url" -o "$GITHUB_WORKSPACE/bin/local-ai")
          echo "download HTTP status: $code"
          chmod +x "$GITHUB_WORKSPACE/bin/local-ai" 2>/dev/null
          echo "---- binary info ----"
          ls -la "$GITHUB_WORKSPACE/bin/local-ai" 2>/dev/null || echo "binary not present"
          file "$GITHUB_WORKSPACE/bin/local-ai" 2>/dev/null || true
          local-ai --version 2>&1 | head -5 || echo "local-ai --version failed"
          MODEL="${LOCALAI_MODEL:-$(yq '.localai.model.name' ai.yaml)}"
          echo "Starting LocalAI with model: $MODEL"
          local-ai run "$MODEL" --address ":8080" --models-path "$GITHUB_WORKSPACE/models" > localai.log 2>&1 &
          LAI_PID=$!
          # readyz only means the server is up — the model still has to download
          # and load. Wait until a real completion succeeds (or time out, in
          # which case triage falls back). First inference triggers the load, so
          # allow a long per-attempt timeout.
          deadline=$(( SECONDS + 1200 ))   # up to 20 min for download + load
          ready=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$LAI_PID" 2>/dev/null; then
              echo "local-ai exited early; log tail:"; tail -n 100 localai.log 2>/dev/null; break
            fi
            resp=$(curl -s -m 180 "$LOCALAI_URL/v1/chat/completions" \
              -H 'Content-Type: application/json' \
              -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}")
            if printf '%s' "$resp" | grep -q '"choices"'; then ready=1; break; fi
            echo "model not ready yet (~$(( (deadline - SECONDS) / 60 ))m left): $(printf '%s' "$resp" | head -c 200)"
            sleep 15
          done
          if [ "$ready" = 1 ]; then
            echo "LocalAI model '$MODEL' is loaded and answering."
          else
            echo "LocalAI model not ready; triage will use the deterministic fallback."
            echo "---- localai.log (tail) ----"; tail -n 100 localai.log 2>/dev/null || true
          fi

      # nib is the agent that repairs build breaks / conflicts on owned PRs
      # during remediation. It reads its model config from the OPENAI_* / NIB_*
      # env above (LocalAI). Best-effort: if it can't reach the model, remediate
      # records build-failed/needsHuman exactly as without it.
      - name: Install nib
        run: go install github.com/mudler/nib@${NIB_VERSION:-latest}

      - name: Build ksec
        run: go build -o "$GITHUB_WORKSPACE/bin/ksec" ./cmd/ksec

      # Interactive debugging: when dispatched with debug=true, pause here and
      # expose an SSH/web tmate session (restricted to the run's actor). The
      # full toolchain (ksec, local-ai, govulncheck, trivy, nib, yq) is on PATH;
      # localai.log is in the workspace. Disconnect or `touch continue` to resume.
      - name: Debug via tmate
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Run pipeline
        env:
          # Optional remediation test: a dispatch can inject a synthetic finding
          # (owner/repo=package@version) so the bot plans/opens a real PR for it.
          SEED: ${{ github.event.inputs.seed }}
        run: |
          ksec discover  --state-dir state
          ksec collect   --state-dir state
          ksec correlate --state-dir state
          ksec triage    --state-dir state --require-ai
          ksec remediate --state-dir state $REMEDIATE_DRYRUN --ai-pr-prose=${AI_PR_PROSE} ${SEED:+--seed "$SEED"}
          ksec review    --state-dir state $REMEDIATE_DRYRUN
          ksec render    --state-dir state $DRYRUN

      # Publishing comes first: the dashboard is the deliverable, and it must
      # not depend on a git write succeeding.
      - name: Configure Pages
        if: ${{ env.DRYRUN == '' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ env.DRYRUN == '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Mark the Pages artifact as uploaded
        id: pages_artifact
        if: ${{ env.DRYRUN == '' }}
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      # The org ruleset requires a pull request on main, so the artifacts go to
      # ARTIFACT_BRANCH and one open PR carries them to main. The branch is
      # disposable: every run rewrites it as a single commit on top of the
      # current main, and the workflow's concurrency group means no other run
      # is touching it, so the force-push has no racer to lose.
      - name: Publish state + dashboards
        if: ${{ env.DRYRUN == '' }}
        env:
          # The checkout's token: scoped to this repo, and the permissions
          # block above grants it contents+pull-requests write. KSEC_BOT_TOKEN
          # is for the other repos' PRs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "kairos-security-bot"
          git config user.email "bot@kairos.io"
          git add state/ dashboard.md dashboard.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update security dashboard [skip ci]"

          # Nothing new since the last run's commit: leave the open PR alone
          # rather than churn it with an identical tree.
          if git rev-parse --verify -q "$ARTIFACT_REF" >/dev/null && git diff --quiet "$ARTIFACT_REF" HEAD; then
            echo "$ARTIFACT_BRANCH already carries this content"
            exit 0
          fi

          git push --force origin "HEAD:refs/heads/$ARTIFACT_BRANCH"

          body="Generated by the [Security Dashboard run](${KSEC_RUN_URL}).

          Artifacts only: \`state/\`, \`dashboard.md\` and \`dashboard.json\`, rewritten
          on every scheduled run. The published dashboard does not wait for this
          to merge; merging it is what lets \`main\` catch up with the state the
          pipeline is already using."

          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$ARTIFACT_BRANCH" \
                 --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --body "$body"
            echo "updated PR #$pr"
          else
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$ARTIFACT_BRANCH" \
              --title "chore: update security dashboard" --body "$body"
          fi

  deploy:
    needs: dashboard
    # Gated on the artifact, not on the job: the publish step above can fail
    # (a ruleset change, a token scope) without freezing the published
    # dashboard. !cancelled() is what lets this run when `dashboard` is red.
    if: ${{ !cancelled() && needs.dashboard.outputs.published == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')) }}
    runs-on: cncf-ubuntu-4-16-x86
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
